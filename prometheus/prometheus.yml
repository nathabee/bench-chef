global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "benchchef-backend"
    static_configs:
      - targets: ["host.docker.internal:18071"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "process-exporter"
    static_configs:
      - targets: ["process-exporter:9256"]
